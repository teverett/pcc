name: Platform Tests

# Runs after CI (ci.yml) finishes building rcc, so this workflow never
# builds rcc itself - it only downloads the already-built, already-
# bundled-with-its-own-runtime-libs artifact each of CI's macos/linux/
# windows jobs uploaded (rcc-macos/rcc-linux/rcc-windows) and exercises it
# as a compiler/linker against the example programs.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  platformtests:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            os: macos-latest
            artifact: rcc-macos
          - name: linux
            os: ubuntu-latest
            artifact: rcc-linux
          - name: windows
            os: windows-latest
            artifact: rcc-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # examples.mk's default RCC path is build/bin/rcc(.exe), so
      # downloading straight into that directory (same filenames the
      # macos/linux/windows jobs in ci.yml uploaded) needs no override.
      # `run-id` pulls the artifact from the CI run that triggered this
      # workflow, since artifacts don't cross workflows on their own.
      - name: Download rcc binary
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: build/bin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # actions/download-artifact doesn't preserve the executable bit.
      # (`shell:` can't itself depend on `matrix` - GitHub Actions
      # rejects that context there - so each OS gets its own literal-
      # shell step below instead of one step parameterized by it.)
      - name: Restore executable bit (macOS/Linux)
        if: matrix.name != 'windows'
        run: chmod +x build/bin/rcc

      # Only the i386-linux hello example needs this: rcc's hosted linker
      # resolves `-lc` against the real on-disk 32-bit libc (see
      # WindowsLinuxLinker.cpp's search paths), which Ubuntu doesn't ship
      # by default.
      - name: Install 32-bit libc (Linux target)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libc6-dev-i386

      # Only `make` and `python` are needed here (not gcc) - rcc.exe does
      # its own codegen/linking, and the i386-windows hello example only
      # pulls in msvcrt.dll/kernel32.dll, both present on any Windows
      # machine. `python` is MSYS2's own package (providing the `python3`
      # this job's assertion scripts below run under this shell) - the
      # windows-latest runner's own system Python isn't on PATH inside
      # the `msys2 {0}` shell.
      - uses: msys2/setup-msys2@v2
        if: matrix.name == 'windows'
        with:
          msystem: UCRT64
          update: true
          install: >-
            python
            mingw-w64-ucrt-x86_64-make

      - name: Install py65 (6502 emulator)
        if: matrix.name == 'macos'
        run: pip3 install --break-system-packages py65

      - name: Build and run macOS hello example
        if: matrix.name == 'macos'
        run: |
          make -C examples/hosted-hello macos
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(["examples/hosted-hello/build/hello-macos"], capture_output=True)
          assert result.stdout == b"hello rcc\n", (result.stdout, result.stderr)
          assert result.returncode == 0, result.returncode
          PY

      - name: Build and run Linux hello example
        if: matrix.name == 'linux'
        run: |
          make -C examples/hosted-hello linux
          python3 - <<'PY'
          import subprocess
          output = subprocess.check_output(["examples/hosted-hello/build/hello-linux"])
          assert output == b"hello rcc\n", repr(output)
          PY

      - name: Build and run Windows hello example
        if: matrix.name == 'windows'
        shell: msys2 {0}
        run: |
          mingw32-make -C examples/hosted-hello windows
          python3 - <<'PY'
          import subprocess
          output = subprocess.check_output(["examples/hosted-hello/build/hello-windows.exe"])
          assert output in (b"hello rcc\n", b"hello rcc\r\n"), repr(output)
          PY

      # 6502-freestanding is a freestanding 6502 binary (no OS to exec it on), so
      # it's verified with py65's MPU core instead of actually running it
      # - same self-jump halt detection and zero-page return-value
      # convention (`ac` at addresses 2/3) as tests/run_tests.sh's own
      # check_6502(), since the linker's _start stub for `--format=raw`
      # is the same one M6502Codegen.cpp emits for the raw pipeline.
      - name: Build and run 6502-freestanding in py65 emulator
        if: matrix.name == 'macos'
        run: |
          make -C examples/6502-freestanding
          python3 - <<'PY'
          from py65.devices.mpu6502 import MPU

          with open("examples/6502-freestanding/build/main.bin", "rb") as f:
              data = f.read()

          base = 0x0600
          mpu = MPU()
          mpu.memory[base:base + len(data)] = data
          mpu.pc = base

          for _ in range(2_000_000):
              pc_before = mpu.pc
              mpu.step()
              if mpu.pc == pc_before:  # "halt: jmp halt"
                  break
          else:
              raise SystemExit("simulator never reached the halt loop (step limit exceeded)")

          lo = mpu.memory[2]
          hi = mpu.memory[3]
          val = lo | (hi << 8)
          if val >= 0x8000:
              val -= 0x10000
          assert val == 45, val
          PY

      # 6502-dos33 is an Apple ][ "hello world" (src/rt/apple2/) - also a
      # freestanding 6502 binary, so the same py65 approach as
      # 6502-freestanding applies, but it makes real COUT/CROUT/HOME/
      # SETTXT/VTAB/SETINV/SETNORM calls (asm { jsr ... } in
      # src/rt/apple2/apple2.c) that would otherwise JSR into empty
      # memory. Each is patched with a tiny hand-written 6502 stub before
      # running: COUT ($FDED) appends A (masked back to 7 bits - COUT
      # itself expects bit 7 set for normal display text, see apple2.c's
      # own a2_cout() comment) into a buffer at $0400, tracked via a
      # zero-page position counter at $F0 (ldx $F0; sta $0400,x; inx; stx
      # $F0; rts); CROUT ($FD8E) pushes a newline then falls into that
      # same COUT stub; HOME/SETTXT/VTAB/SETINV/SETNORM are all no-ops
      # (rts) - their effects aren't observable from outside the
      # (nonexistent) text screen, so this only confirms each call itself
      # doesn't crash.
      - name: Build and run 6502-dos33 in py65 emulator
        if: matrix.name == 'macos'
        run: |
          make -C examples/6502-dos33 "$(pwd)/examples/6502-dos33/build/main.raw"
          python3 - <<'PY'
          from py65.devices.mpu6502 import MPU

          with open("examples/6502-dos33/build/main.raw", "rb") as f:
              data = f.read()

          base = 0x2000
          mpu = MPU()
          mpu.memory[base:base + len(data)] = data

          mpu.memory[0xFDED:0xFDED + 9] = [0xA6, 0xF0, 0x9D, 0x00, 0x04, 0xE8, 0x86, 0xF0, 0x60]
          mpu.memory[0xF0] = 0
          mpu.memory[0xFD8E:0xFD8E + 5] = [0xA9, 0x8A, 0x4C, 0xED, 0xFD]
          mpu.memory[0xFC58] = 0x60  # HOME
          mpu.memory[0xFB39] = 0x60  # SETTXT
          mpu.memory[0xFC22] = 0x60  # VTAB
          mpu.memory[0xFE80] = 0x60  # SETINV
          mpu.memory[0xFE84] = 0x60  # SETNORM

          mpu.pc = base
          for _ in range(2_000_000):
              pc_before = mpu.pc
              mpu.step()
              if mpu.pc == pc_before:
                  break
          else:
              raise SystemExit("simulator never reached the halt loop (step limit exceeded)")

          n = mpu.memory[0xF0]
          out = bytes(mpu.memory[0x0400 + i] & 0x7F for i in range(n))
          assert out == b"HELLO, WORLD!\n", out
          PY
