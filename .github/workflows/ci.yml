name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with the `antlr`/`antlr4-cpp-runtime` Homebrew
  # formula versions used for local dev (see Makefile) - the ANTLR
  # tool jar and the C++ runtime it links against must be the same
  # version.
  ANTLR_VERSION: "4.13.2"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install ANTLR, runtime and target simulators (Homebrew)
        run: brew install antlr antlr4-cpp-runtime open-simh qemu

      - name: Build
        run: make

      - name: Test
        run: make test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tried Ubuntu's own `libantlr4-runtime-dev` package first (it's
      # 4.10 - 4.13.2-generated code needs antlr4::internal::OnceFlag,
      # added after 4.10, so that doesn't compile), then building the
      # exact version from source with CMake (repeatedly got the job
      # killed partway through, SIGTERM, even static-only/-O0 - this
      # runtime's own build apparently just doesn't fit in whatever's
      # killing it here). conda-forge's `antlr-cpp-runtime` package
      # ships a genuine prebuilt 4.13.2 for linux-64 - no compiling
      # anything, so no more timeout to hit.
      - name: Install build tools and target simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential default-jre-headless \
              qemu-system-x86 netcat-openbsd simh

      - name: Install ANTLR C++ runtime (conda-forge, prebuilt, exact version)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: antlr
          create-args: -c conda-forge antlr-cpp-runtime=${{ env.ANTLR_VERSION }}

      - name: Download ANTLR tool jar
        run: |
          curl -fsSL -o "${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"

      # setup-micromamba activates the env via shell profile scripts,
      # so later steps need a login shell (`-el`) to see $CONDA_PREFIX.
      - name: Build
        shell: bash -el {0}
        run: |
          make ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX="$CONDA_PREFIX"

      - name: Test
        shell: bash -el {0}
        run: |
          # The conda package ships both a static and a shared lib;
          # the Makefile's plain `-lantlr4-runtime` links the shared
          # one (the linker's own default when both exist), so
          # running the built pcc binary needs it on the loader path.
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          make test ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
                     ANTLR4_RUNTIME_PREFIX="$CONDA_PREFIX"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # MSYS2 ships a prebuilt mingw-w64-x86_64-antlr4-runtime-cpp at
      # exactly ANTLR_VERSION (4.13.2) - no from-source build needed
      # here at all (unlike Linux's own libantlr4-runtime-dev, this
      # one is an exact version match for the jar below).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-antlr4-runtime-cpp
            curl

      - name: Download ANTLR tool jar
        run: |
          curl -fsSL -o "${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"

      # The GitHub-hosted Windows runner ships its own JRE for `java`.
      # MSYS2's MINGW64 packages install under /mingw64.
      - name: Build
        run: |
          make CXX=g++ ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX=/mingw64

      # tests/run_tests.sh needs the pdp7 (open-simh) and qemu-system-i386
      # hardware simulators, which aren't readily available on Windows
      # CI runners - so this job only verifies that pcc itself builds.
