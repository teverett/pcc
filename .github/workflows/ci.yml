name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with the `antlr`/`antlr4-cpp-runtime` Homebrew
  # formula versions used for local dev (see Makefile) - the ANTLR
  # tool jar and the C++ runtime it links against must be the same
  # version.
  ANTLR_VERSION: "4.13.2"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install ANTLR, runtime and target simulators (Homebrew)
        run: brew install antlr antlr4-cpp-runtime open-simh qemu

      - name: Build
        run: make

      - name: Test
        run: make test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tried Ubuntu's own `libantlr4-runtime-dev` package here first
      # (to skip building from source entirely) - it's 4.10, and
      # 4.13.2-generated code (antlr4::internal::OnceFlag, added
      # after 4.10) doesn't actually compile against it. No Ubuntu
      # package currently ships a matching 4.13.x runtime, so this
      # vendors the exact ANTLR_VERSION from source instead (via
      # ci/antlr-runtime/ below) - same version as local/macOS dev
      # (see that var's own comment).
      - name: Install build tools and target simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential cmake default-jre-headless \
              qemu-system-x86 netcat-openbsd simh

      - name: Cache vendored ANTLR tool + C++ runtime
        id: antlr-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/antlr-vendor
          key: antlr-vendor-linux-${{ env.ANTLR_VERSION }}-v2

      # ci/antlr-runtime/ is a small standalone CMake project (not
      # pcc's own build - see its own header comment) that fetches,
      # builds and installs the runtime via ExternalProject_Add in
      # one `cmake --build` - replaces the old hand-rolled `git
      # clone` + separate `cmake -S/-B`/`--install` steps this job
      # used to run inline here.
      - name: Vendor ANTLR C++ runtime via CMake (ci/antlr-runtime/)
        if: steps.antlr-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          VENDOR="${{ runner.temp }}/antlr-vendor"
          mkdir -p "$VENDOR"
          curl -fsSL -o "$VENDOR/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"
          cmake -S ci/antlr-runtime -B "${{ runner.temp }}/antlr4-build" \
                -DANTLR_GIT_TAG="${ANTLR_VERSION}" \
                -DANTLR_INSTALL_PREFIX="$VENDOR"
          cmake --build "${{ runner.temp }}/antlr4-build" --parallel

      - name: Build
        run: |
          VENDOR="${{ runner.temp }}/antlr-vendor"
          make ANTLR="java -jar $VENDOR/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX="$VENDOR"

      - name: Test
        run: |
          VENDOR="${{ runner.temp }}/antlr-vendor"
          make test ANTLR="java -jar $VENDOR/antlr-${ANTLR_VERSION}-complete.jar" \
                     ANTLR4_RUNTIME_PREFIX="$VENDOR"

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # MSYS2 ships a prebuilt mingw-w64-x86_64-antlr4-runtime-cpp at
      # exactly ANTLR_VERSION (4.13.2) - no from-source build needed
      # here at all (unlike Linux's own libantlr4-runtime-dev, this
      # one is an exact version match for the jar below).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-antlr4-runtime-cpp
            curl

      - name: Download ANTLR tool jar
        run: |
          curl -fsSL -o "${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"

      # The GitHub-hosted Windows runner ships its own JRE for `java`.
      # MSYS2's MINGW64 packages install under /mingw64.
      - name: Build
        run: |
          make CXX=g++ ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX=/mingw64

      # tests/run_tests.sh needs the pdp7 (open-simh) and qemu-system-i386
      # hardware simulators, which aren't readily available on Windows
      # CI runners - so this job only verifies that pcc itself builds.
