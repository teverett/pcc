name: CI

on:
  push:
  pull_request:

env:
  # Keep in lockstep with whatever ANTLR version generated
  # src/generated/ (see scripts/generate-grammars.sh) - the C++
  # runtime these jobs install below has to be that same version,
  # never just "whatever's convenient" (see Makefile's own comment on
  # antlr4::internal::OnceFlag). The ANTLR *tool* (Java + the jar)
  # isn't needed here at all anymore: src/generated/ is checked into
  # git, and this workflow only ever compiles it.
  ANTLR_VERSION: "4.13.2"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # `pandoc` (Markdown -> PDF) needs a real PDF-rendering engine
      # behind it. `xelatex` (not the more commonly-suggested
      # `pdflatex`) specifically, because docs/*.md leans heavily on
      # real Unicode punctuation throughout (em dashes, `±`, etc. -
      # confirmed directly, dozens of real occurrences, not a
      # theoretical concern) that `xelatex`'s own native UTF-8/system-
      # font handling renders correctly without the `inputenc`/
      # `fontenc` package juggling `pdflatex` would otherwise need.
      # `lmodern` + `texlive-fonts-recommended`/`texlive-latex-extra`:
      # pandoc's own default LaTeX template expects these (a few
      # packages it reaches for - `fancyvrb` for code blocks,
      # `longtable` for docs/using.md's own real tables - aren't in
      # `texlive-xetex` alone).
      - name: Install pandoc and a PDF engine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-fonts-recommended texlive-latex-extra lmodern

      # One PDF per file under docs/ - see docs/ir.md's own header
      # comment etc. for what each one covers; this job's whole job
      # is making them available as a build artifact too, not just
      # viewable on GitHub as Markdown.
      - name: Render docs/*.md to PDF
        run: |
          mkdir -p build/docs-pdf
          for src in docs/*.md; do
            name="$(basename "$src" .md)"
            pandoc "$src" --pdf-engine=xelatex --metadata title="$name" -o "build/docs-pdf/$name.pdf"
          done

      - name: Upload documentation PDFs
        uses: actions/upload-artifact@v7
        with:
          name: pcc-docs
          path: build/docs-pdf/*.pdf
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ANTLR C++ runtime and target simulators (Homebrew)
        run: brew install antlr4-cpp-runtime open-simh qemu

      # `make test` (below) drives real, independent CPU cores for the
      # 6502/65c02 (py65) and 8080/z80 (z80-python) targets - see
      # tests/run_tests.sh's own per-target comments for why each one
      # needs its own PyPI package rather than a from-scratch
      # emulator. `--break-system-packages`: this runner's system
      # Python is PEP 668 "externally managed" (confirmed directly -
      # a plain `pip3 install` here fails with exactly that error),
      # and a dedicated venv would be one more thing to keep in sync
      # for no real benefit - nothing else on this runner depends on
      # its system Python packages.
      - name: Install Python simulator packages (py65, z80-python)
        run: pip3 install --break-system-packages py65 z80-python

      - name: Build
        run: make

      - name: Test archive and Mach-O object readers/writers
        run: make build/bin/archive_reader_test build/bin/macho_data_test && build/bin/archive_reader_test && build/bin/macho_data_test

      - name: Test internal hosted linkers and macOS runtime
        run: bash tests/run_hosted_macos_link_tests.sh build/bin/pcc

      - name: Build and run macOS hello example
        run: |
          make -C examples/example1 macos
          python3 - <<'PY'
          import subprocess
          result = subprocess.run(["examples/example1/build/hello-macos"], capture_output=True)
          assert result.stdout == b"hello pcc\n", (result.stdout, result.stderr)
          assert result.returncode == 0, result.returncode
          PY

      # `pcc` is dynamically linked against Homebrew's own
      # libantlr4-runtime.dylib, at that formula's own absolute
      # install path (confirmed directly via `otool -L` - unlike
      # libc++.1.dylib/libSystem.B.dylib, both real system libraries
      # present on every Mac regardless, that one isn't) - running the
      # bare binary on a Mac without that same Homebrew formula
      # installed fails to launch at all ("Library not loaded"), the
      # same class of bug as the Windows job's own missing-DLL one.
      # `otool -L` lists every dependency exactly the way `ldd` does
      # on the other two jobs; filtering out `/usr/lib`/`/System` (every
      # real system library always lives under one of those) leaves
      # only whatever a Homebrew formula actually provided. Copying it
      # next to the binary isn't enough on its own, though - unlike
      # Windows' plain "search the exe's own directory" default,
      # macOS bakes each dependency's own install *path* into the
      # binary at link time, so `install_name_tool -change` has to
      # rewrite that path to `@executable_path/<name>` (resolved
      # relative to wherever the exe itself ends up, not a fixed
      # path) before the copy actually gets found at runtime.
      - name: Bundle pcc's own Homebrew runtime dylib
        run: |
          for lib in $(otool -L build/bin/pcc | tail -n +2 | awk '{print $1}' | grep -v '^/usr/lib/\|^/System/'); do
            cp "$lib" build/bin/
            install_name_tool -change "$lib" "@executable_path/$(basename "$lib")" build/bin/pcc
          done

      - name: Upload pcc binary
        uses: actions/upload-artifact@v7
        with:
          name: pcc-macos
          path: |
            build/bin/pcc
            build/bin/*.dylib
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tried Ubuntu's own `libantlr4-runtime-dev` package first (it's
      # 4.10 - 4.13.2-generated code needs antlr4::internal::OnceFlag,
      # added after 4.10, so that doesn't compile), then building the
      # exact version from source with CMake (repeatedly got the job
      # killed partway through, SIGTERM, even static-only/-O0 - this
      # runtime's own build apparently just doesn't fit in whatever's
      # killing it here). conda-forge's `antlr-cpp-runtime` package
      # ships a genuine prebuilt 4.13.2 for linux-64 - no compiling
      # anything, so no more timeout to hit.
      # `patchelf` (below) sets the built binary's own rpath so it can
      # find its one non-system shared library next to itself at
      # runtime - see that step's own comment.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential patchelf libc6-dev-i386

      - name: Test QEMU monitor harness
        run: python3 tests/qemu_wait_test.py

      - name: Test Linux CI runtime configuration
        run: python3 tests/linux_ci_runtime_test.py

      - name: Install ANTLR C++ runtime (conda-forge, prebuilt, exact version)
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antlr
          create-args: -c conda-forge antlr-cpp-runtime=${{ env.ANTLR_VERSION }}

      - name: Configure runtime library path
        shell: bash -el {0}
        run: bash scripts/configure_linux_ci_runtime.sh

      # setup-micromamba activates the env via shell profile scripts,
      # so this step needs a login shell (`-el`) to see $CONDA_PREFIX.
      - name: Build
        shell: bash -el {0}
        run: make ANTLR4_RUNTIME_PREFIX="$CONDA_PREFIX"

      - name: Test archive and Mach-O object readers/writers
        shell: bash -el {0}
        run: make build/bin/archive_reader_test build/bin/macho_data_test && build/bin/archive_reader_test && build/bin/macho_data_test

      - name: Build and run Linux hello example
        shell: bash -el {0}
        run: |
          make -C examples/example1 linux
          python3 - <<'PY'
          import subprocess
          output = subprocess.check_output(["examples/example1/build/hello-linux"])
          assert output == b"hello pcc\n", repr(output)
          PY

      - name: Test hosted ELF library linking
        shell: bash -el {0}
        run: bash tests/run_hosted_link_tests.sh build/bin/pcc

      - name: Test hosted Windows .lib linking
        shell: bash -el {0}
        run: bash tests/run_hosted_windows_link_tests.sh build/bin/pcc

      # Full simulator-backed suites run in the macOS job; monitor
      # protocol tests use an independent fake monitor on every OS.

      # Bundle non-system libraries and set an executable-relative rpath.
      # The final check verifies resolution without the conda environment.
      - name: Bundle pcc's own conda-forge runtime library
        shell: bash -el {0}
        run: |
          for lib in $(ldd build/bin/pcc | awk '{print $3}' | grep -vE '^(/lib|/usr/lib)' | grep -v '^$'); do
            cp "$lib" build/bin/
          done
          patchelf --set-rpath '$ORIGIN' build/bin/pcc
          if env -i PATH="/usr/bin:/bin" ldd build/bin/pcc | grep -q 'not found'; then
            echo "pcc still has an unresolved dependency once LD_LIBRARY_PATH/conda are gone:" >&2
            env -i PATH="/usr/bin:/bin" ldd build/bin/pcc >&2
            exit 1
          fi

      - name: Upload pcc binary
        uses: actions/upload-artifact@v7
        with:
          name: pcc-linux
          path: |
            build/bin/pcc
            build/bin/*.so*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # MSYS2 ships a prebuilt antlr4-runtime-cpp at exactly
      # ANTLR_VERSION (4.13.2) - an exact version match, and (like
      # Linux's conda-forge package) nothing to compile at all - but
      # only for the ucrt64 environment, not mingw64 (confirmed by a
      # real `pacman: target not found` on mingw-w64-x86_64-antlr4-
      # runtime-cpp), so this job uses UCRT64 throughout.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            python
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-antlr4-runtime-cpp
            mingw-w64-cross-mingw32-gcc

      - name: Test QEMU monitor harness
        run: python3 tests/qemu_wait_test.py

      # MSYS2's UCRT64 packages install under /ucrt64. The mingw-w64
      # `make` package's binary is named mingw32-make.exe (not
      # make.exe, even on 64-bit/ucrt64 - a legacy MinGW naming
      # convention), confirmed by a real `make: command not found`.
      - name: Build
        run: mingw32-make CXX=g++ ANTLR4_RUNTIME_PREFIX=/ucrt64

      - name: Test archive and Mach-O object readers/writers
        run: mingw32-make CXX=g++ build/bin/archive_reader_test build/bin/macho_data_test && build/bin/archive_reader_test.exe && build/bin/macho_data_test.exe

      - name: Test internal hosted linkers and Windows runtime
        run: bash tests/run_hosted_windows_link_tests.sh build/bin/pcc.exe

      - name: Build and run Windows hello example
        run: |
          export PATH="/opt/bin:$PATH"
          mingw32-make -C examples/example1 windows
          python3 - <<'PY'
          import subprocess
          output = subprocess.check_output(["examples/example1/build/hello-windows.exe"])
          assert output in (b"hello pcc\n", b"hello pcc\r\n"), repr(output)
          PY

      # Full simulator-backed suites run in the macOS job.

      # pcc.exe is dynamically linked against several UCRT64 DLLs
      # (libgcc_s_seh-1.dll, libwinpthread-1.dll, libstdc++-6.dll,
      # libantlr4-runtime.dll) that only exist inside this MSYS2
      # environment (/ucrt64/bin) - running the bare exe anywhere else
      # fails immediately with a "code execution cannot proceed, X.dll
      # was not found" dialog per missing DLL (confirmed directly).
      # `ldd` (available here, same as on any POSIX-ish shell) lists
      # the exe's own full, already-transitively-resolved dependency
      # set exactly the way the real Windows loader would walk it, so
      # copying whatever that reports from inside /ucrt64 - rather than
      # hardcoding today's four names, which would silently go stale
      # the moment a toolchain/antlr4 upgrade adds or renames one -
      # bundling them alongside the exe (Windows' own DLL search order
      # checks the exe's own directory first) is what actually makes
      # the uploaded artifact runnable standalone.
      - name: Bundle pcc.exe's own MSYS2 runtime DLLs
        run: |
          for dll in $(ldd build/bin/pcc.exe | grep -oE '/ucrt64/[^ ]+\.dll'); do
            cp "$dll" build/bin/
          done

      # MinGW's linker driver appends ".exe" to an -o target with no
      # extension on its own, so the Makefile's plain `pcc` TARGET
      # actually comes out as pcc.exe here - the glob covers either
      # name without hardcoding which. This now also picks up every
      # DLL the previous step just copied alongside it.
      - name: Upload pcc binary
        uses: actions/upload-artifact@v7
        with:
          name: pcc-windows
          path: |
            build/bin/pcc*
            build/bin/*.dll
          if-no-files-found: error
