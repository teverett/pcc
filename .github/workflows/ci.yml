name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with whatever ANTLR version generated
  # src/generated/ (see scripts/generate-grammars.sh) - the C++
  # runtime these jobs install below has to be that same version,
  # never just "whatever's convenient" (see Makefile's own comment on
  # antlr4::internal::OnceFlag). The ANTLR *tool* (Java + the jar)
  # isn't needed here at all anymore: src/generated/ is checked into
  # git, and this workflow only ever compiles it.
  ANTLR_VERSION: "4.13.2"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install ANTLR C++ runtime and target simulators (Homebrew)
        run: brew install antlr4-cpp-runtime open-simh qemu

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Upload pcc binary
        uses: actions/upload-artifact@v4
        with:
          name: pcc-macos
          path: build/bin/pcc
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Tried Ubuntu's own `libantlr4-runtime-dev` package first (it's
      # 4.10 - 4.13.2-generated code needs antlr4::internal::OnceFlag,
      # added after 4.10, so that doesn't compile), then building the
      # exact version from source with CMake (repeatedly got the job
      # killed partway through, SIGTERM, even static-only/-O0 - this
      # runtime's own build apparently just doesn't fit in whatever's
      # killing it here). conda-forge's `antlr-cpp-runtime` package
      # ships a genuine prebuilt 4.13.2 for linux-64 - no compiling
      # anything, so no more timeout to hit.
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential

      - name: Install ANTLR C++ runtime (conda-forge, prebuilt, exact version)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: antlr
          create-args: -c conda-forge antlr-cpp-runtime=${{ env.ANTLR_VERSION }}

      # setup-micromamba activates the env via shell profile scripts,
      # so this step needs a login shell (`-el`) to see $CONDA_PREFIX.
      - name: Build
        shell: bash -el {0}
        run: make ANTLR4_RUNTIME_PREFIX="$CONDA_PREFIX"

      # No Test step here (same as the windows job, and for the same
      # reason): tests/run_tests.sh needs the real pdp7 (SIMH) and
      # qemu-system-i386 hardware simulators, and SIMH's console
      # hung indefinitely on this runner in practice (confirmed by a
      # real run getting killed mid-`make test`, before any test's
      # PASS/FAIL even printed) - almost certainly SIMH wanting a
      # real TTY that a CI runner doesn't have. Simulator-backed
      # testing stays a local/manual check (`make test` still works
      # fine there); this job only verifies pcc itself builds.

      - name: Upload pcc binary
        uses: actions/upload-artifact@v4
        with:
          name: pcc-linux
          path: build/bin/pcc
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # MSYS2 ships a prebuilt antlr4-runtime-cpp at exactly
      # ANTLR_VERSION (4.13.2) - an exact version match, and (like
      # Linux's conda-forge package) nothing to compile at all - but
      # only for the ucrt64 environment, not mingw64 (confirmed by a
      # real `pacman: target not found` on mingw-w64-x86_64-antlr4-
      # runtime-cpp), so this job uses UCRT64 throughout.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-antlr4-runtime-cpp

      # MSYS2's UCRT64 packages install under /ucrt64. The mingw-w64
      # `make` package's binary is named mingw32-make.exe (not
      # make.exe, even on 64-bit/ucrt64 - a legacy MinGW naming
      # convention), confirmed by a real `make: command not found`.
      - name: Build
        run: mingw32-make CXX=g++ ANTLR4_RUNTIME_PREFIX=/ucrt64

      # tests/run_tests.sh needs the pdp7 (open-simh) and qemu-system-i386
      # hardware simulators, which aren't readily available on Windows
      # CI runners - so this job only verifies that pcc itself builds.

      # MinGW's linker driver appends ".exe" to an -o target with no
      # extension on its own, so the Makefile's plain `pcc` TARGET
      # actually comes out as pcc.exe here - the glob covers either
      # name without hardcoding which.
      - name: Upload pcc binary
        uses: actions/upload-artifact@v4
        with:
          name: pcc-windows
          path: build/bin/pcc*
          if-no-files-found: error
