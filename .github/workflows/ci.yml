name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # Keep in lockstep with the `antlr`/`antlr4-cpp-runtime` Homebrew
  # formula versions used for local dev (see Makefile) - the ANTLR
  # tool jar and the C++ runtime it links against must be the same
  # version.
  ANTLR_VERSION: "4.13.2"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Install ANTLR, runtime and target simulators (Homebrew)
        run: brew install antlr antlr4-cpp-runtime open-simh qemu

      - name: Build
        run: make

      - name: Test
        run: make test

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Ubuntu's own `libantlr4-runtime-dev` (currently 4.10, in
      # universe) instead of building the runtime from source - that
      # repeatedly got the job killed partway through (SIGTERM) on
      # this runner. It's a slightly older minor version than the
      # ANTLR_VERSION jar below (matched to local/macOS dev instead -
      # see that var's own comment), but the handful of C++ runtime
      # APIs pcc's generated code actually calls (ANTLRInputStream,
      # CommonTokenStream, the Lexer/Parser/error-listener base
      # classes) have been stable across that whole range; the Test
      # step below is exactly what would catch it if that ever
      # stopped being true.
      - name: Install ANTLR C++ runtime, build tools and target simulators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential default-jre-headless libantlr4-runtime-dev \
              qemu-system-x86 netcat-openbsd simh

      - name: Download ANTLR tool jar
        run: |
          curl -fsSL -o "${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"

      - name: Build
        run: |
          make ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX=/usr

      - name: Test
        run: |
          make test ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
                     ANTLR4_RUNTIME_PREFIX=/usr

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7

      # MSYS2 ships a prebuilt mingw-w64-x86_64-antlr4-runtime-cpp at
      # exactly ANTLR_VERSION (4.13.2) - no from-source build needed
      # here at all (unlike Linux's own libantlr4-runtime-dev, this
      # one is an exact version match for the jar below).
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make
            mingw-w64-x86_64-antlr4-runtime-cpp
            curl

      - name: Download ANTLR tool jar
        run: |
          curl -fsSL -o "${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
              "https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar"

      # The GitHub-hosted Windows runner ships its own JRE for `java`.
      # MSYS2's MINGW64 packages install under /mingw64.
      - name: Build
        run: |
          make CXX=g++ ANTLR="java -jar ${{ runner.temp }}/antlr-${ANTLR_VERSION}-complete.jar" \
               ANTLR4_RUNTIME_PREFIX=/mingw64

      # tests/run_tests.sh needs the pdp7 (open-simh) and qemu-system-i386
      # hardware simulators, which aren't readily available on Windows
      # CI runners - so this job only verifies that pcc itself builds.
